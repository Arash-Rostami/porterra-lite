services:
  db:
    image: mysql:8.0
    container_name: porterra-lite-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-porterra-lite}
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    volumes:
      - porterra-lite-db-data:/var/lib/mysql
      # Applied once, only when the data volume is first created — see db/README.md.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-p${MYSQL_PASSWORD:-root}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  porterra-lite-db-data:
